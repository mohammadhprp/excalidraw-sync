name: publish

on:
  push:
  pull_request:

# Least privilege by default; only the release job opts into write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: dist

      - name: Package extension zip
        run: |
          cd dist
          zip -r "../excalidraw-sync-${GITHUB_REF_NAME}.zip" .
          cd ..
          unzip -l "excalidraw-sync-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "excalidraw-sync-${GITHUB_REF_NAME}.zip"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
